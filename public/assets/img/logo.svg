<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2136"/>
      <stop offset=".55" stop-color="#16375c"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fb5ea"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- Ledger bars: two balanced entries and one accent (the running balance) -->
  <rect x="20" y="26" width="40" height="10" rx="5" fill="#ffffff" opacity=".92"/>
  <rect x="20" y="43" width="28" height="10" rx="5" fill="#ffffff" opacity=".55"/>
  <rect x="20" y="60" width="52" height="10" rx="5" fill="url(#bar)"/>
  <!-- Rising tick: the balance trending up -->
  <path d="M56 46 L66 36 L76 44" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="44" r="5" fill="#38bdf8"/>
</svg>
